services:
  image-studio:
    build:
      context: .
      dockerfile: Dockerfile
    image: image-studio:local
    container_name: image-studio
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "${BIND_HOST:-127.0.0.1}:${HOST_PORT:-3000}:80"
    environment:
      NGINX_FRAME_ANCESTORS: "${NGINX_FRAME_ANCESTORS:-*}"
      NGINX_ENVSUBST_FILTER: "^NGINX_FRAME_ANCESTORS$"
    mem_limit: 64m
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
